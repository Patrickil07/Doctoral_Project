# Unit, smoke and recovery tests (tests/), including step 08 in R. Made-up data
# only: no secrets, no downloads of research data.
name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements-dev.txt
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: HonestDiD (R) for step 08
        run: |
          sudo apt-get install -y -qq libglpk40   # system library the Rglpk binary links to
          Rscript .github/install_honestdid.R
      - run: python -m pytest -q -rs
