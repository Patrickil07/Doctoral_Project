# Rebuilds step 06 (Chapter 4 figures and formatted tables), and optionally
# step 08 (Honest DiD), for a run already saved on the `results` branch,
# without re-running the pipeline. It reads only
# the saved aggregate files in runs/<run>/ (no IPUMS access, no microdata).
#
# Start it from the Actions tab: "build-chapter4" -> "Run workflow". Leave the
# run folder empty for the newest run. The output is saved to
# runs/<run>/chapter4/ on the `results` branch and as a run artifact.
# Pushes to the development branch below only build the artifact (a preview),
# they never write to the `results` branch.
name: build-chapter4

on:
  workflow_dispatch:
    inputs:
      run:
        description: "run folder on the results branch, e.g. 2026-09-28_run5_8d9019c (empty = newest)"
        default: ""
      honest_did:
        description: "also (re)run step 08 Honest DiD for RQ1 (needs a run saved with *_vcov.csv files)"
        type: boolean
        default: false
  push:
    branches: [claude/project-thread-snm3tj]
    paths: [.github/workflows/build-chapter4.yml, src/06_figures_tables.py]

permissions:
  contents: write   # to save the output on the `results` branch

concurrency:
  group: results-branch
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt
      - name: Check out the results branch
        run: |
          git fetch --depth=1 origin results
          git worktree add --detach "$RUNNER_TEMP/results" FETCH_HEAD
      - name: Pick the run folder
        id: pick
        run: |
          run="${{ inputs.run }}"
          if [ -z "$run" ]; then
            # newest = latest date, then highest run number
            run=$(ls "$RUNNER_TEMP/results/runs" | sort -t_ -k1,1 -k2.4n | tail -1)
          fi
          [ -d "$RUNNER_TEMP/results/runs/$run" ] || { echo "::error::runs/$run not found on the results branch"; exit 1; }
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "building from runs/$run"
      - uses: r-lib/actions/setup-r@v2
        if: inputs.honest_did
        with:
          use-public-rspm: true
      - name: 08 Honest DiD for RQ1
        if: inputs.honest_did
        timeout-minutes: 150
        run: |
          sudo apt-get install -y -qq libglpk40
          Rscript .github/install_honestdid.R
          dir="$RUNNER_TEMP/results/runs/${{ steps.pick.outputs.run }}/data/out"
          for d in "$dir/results" "$dir/results_rq1_from_2021q4"; do
            if [ -f "$d/rq1_task_composition_vcov.csv" ]; then Rscript src/08_honest_did.R --results "$d"; fi
          done
      - name: 06 figures and Chapter 4 tables
        env:
          FIGURES_CODE_SHA: ${{ github.sha }}
        run: |
          dir="$RUNNER_TEMP/results/runs/${{ steps.pick.outputs.run }}"
          rm -rf "$dir/chapter4"
          python src/06_figures_tables.py --root "$dir" --out "$dir/chapter4"
      - uses: actions/upload-artifact@v4
        with:
          name: chapter4-${{ steps.pick.outputs.run }}
          path: ${{ runner.temp }}/results/runs/${{ steps.pick.outputs.run }}/chapter4/
          retention-days: 90
      - name: Save to the results branch
        if: github.event_name == 'workflow_dispatch'
        run: |
          cd "$RUNNER_TEMP/results"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "runs/${{ steps.pick.outputs.run }}/chapter4" "runs/${{ steps.pick.outputs.run }}/data/out"
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "Chapter 4 figures and tables for ${{ steps.pick.outputs.run }} (code ${GITHUB_SHA::7})"
          git push -q origin HEAD:refs/heads/results
          echo "saved to branch results: runs/${{ steps.pick.outputs.run }}/chapter4/"
      - name: Copy the run to Google Drive
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          RCLONE_DRIVE_TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ vars.GDRIVE_FOLDER_ID || '12_f3R1HHxOasFozCCVDC5bv_w3AisX7r' }}
        run: .github/sync_drive.sh "$RUNNER_TEMP/results/runs/${{ steps.pick.outputs.run }}" "${{ steps.pick.outputs.run }}"
